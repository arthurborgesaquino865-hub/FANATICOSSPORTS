<!DOCTYPE html>

<html lang="pt-BR">


<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>
    Fanáticos Sports
  </title>


  <!--====================================================
        CSS
    =====================================================-->

  <link rel="stylesheet" href="/style/home.css">


  <!--====================================================
        FONT AWESOME
    =====================================================-->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


  <!--====================================================
        JAVASCRIPT
    =====================================================-->

  <script src="/js/home.js" defer>
  </script>

</head>


<body>


  <div id="app">


    <!--====================================================
            HEADER
        =====================================================-->

    <header id="header">


      <div class="top-header">


        <!--================================================
                    LOGO
                =================================================-->

        <div class="logo">


          <a href="/index.html">


            <img id="logoImagem" src="" alt="Logo">


            <h1 id="logoTexto">
            </h1>


          </a>


        </div>


        <!--================================================
                    PESQUISA
                =================================================-->

        <div class="search">


          <input id="txtPesquisar" type="text" placeholder="">


          <button id="btnPesquisar" type="button">

            <i class="fas fa-search">
            </i>

          </button>


        </div>


        <!--================================================
                    ÍCONES
                =================================================-->

        <div class="icons">


          <a id="btnFavoritos" href="#">

            <i class="far fa-heart">
            </i>

          </a>


          <a id="btnCarrinho" href="#">

            <i class="fas fa-shopping-cart">
            </i>

          </a>


          <a id="btnLogin" href="#">

            <i class="far fa-user">
            </i>

          </a>


        </div>


      </div>


    </header>



    <!--====================================================
            MENU
        =====================================================-->

    <nav id="menuPrincipal">


      <ul>


        <li>

          <a id="menu1" href="#">
          </a>

        </li>


        <li>

          <a id="menu2" href="#">
          </a>

        </li>


        <li>

          <a id="menu3" href="#">
          </a>

        </li>


        <li>

          <a id="menu4" href="#">
          </a>

        </li>


        <li>

          <a id="menu5" href="#">
          </a>

        </li>


        <li>

          <a id="menu6" href="#">
          </a>

        </li>


        <li>

          <a id="menu7" href="#">
          </a>

        </li>


      </ul>


    </nav>



    <!--====================================================
            MAIN
        =====================================================-->

    <main>


      <!--================================================
                BANNER
            =================================================-->

      <section id="banner">


        <div class="banner-texto">


          <small id="bannerTag">
          </small>


          <h2 id="bannerTitulo">
          </h2>


          <p id="bannerDescricao">
          </p>


          <button id="bannerBotao" type="button">
          </button>


        </div>


        <div class="banner-imagem">


          <img id="bannerImagem" src="" alt="Banner">


        </div>


      </section>



      <!--================================================
                PRODUTOS
            =================================================-->

      <section id="maisVendidos">


        <h2 id="tituloMaisVendidos">

          Produtos

        </h2>


        <!--================================================
                    O JAVASCRIPT VAI COLOCAR OS PRODUTOS AQUI
                =================================================-->

        <div id="listaProdutos" class="produtos">


          <p class="carregando-produtos">

            Carregando produtos...

          </p>


        </div>


      </section>


    </main>



    <!--====================================================
            FOOTER
        =====================================================-->

    <footer id="footer">


      <div class="footer-grid">


        <!-- COLUNA 1 -->

        <div>


          <h3 id="footerTitulo1">
          </h3>


          <p id="footerTexto1">
          </p>


        </div>


        <!-- COLUNA 2 -->

        <div>


          <h3 id="footerTitulo2">
          </h3>


          <a id="footerLink1" href="#">
          </a>


          <a id="footerLink2" href="#">
          </a>


          <a id="footerLink3" href="#">
          </a>


        </div>


        <!-- COLUNA 3 -->

        <div>


          <h3 id="footerTitulo3">
          </h3>


          <a id="footerContato1" href="#">
          </a>


          <a id="footerContato2" href="#">
          </a>


          <a id="footerContato3" href="#">
          </a>


        </div>


        <!-- COLUNA 4 -->

        <div>


          <h3 id="footerTitulo4">
          </h3>


          <a id="facebook" href="#">
          </a>


          <a id="instagram" href="#">
          </a>


          <a id="youtube" href="#">
          </a>


        </div>


      </div>


      <div class="copyright">


        <p id="copyright">
        </p>


      </div>


    </footer>


  </div>


</body>


</html>
