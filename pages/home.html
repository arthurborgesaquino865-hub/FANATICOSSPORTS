<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página Inicial</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/style/home.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- JavaScript -->
    <script src="/js/home.js" defer></script>

</head>

<body>

    <div id="app">

        <!--======================================================
HEADER
=======================================================-->

        <header id="header">

            <div class="top-header">

                <!-- Logo -->

                <div class="logo">

                    <img id="logoImagem" src="" alt="Logo">

                    <h1 id="logoTexto"></h1>

                </div>

                <!-- Pesquisa -->

                <div class="search">

                    <input id="txtPesquisar" type="text" placeholder="">

                    <button id="btnPesquisar">

                        <i class="fas fa-search"></i>

                    </button>

                </div>

                <!-- Ícones -->

                <div class="icons">

                    <a id="btnFavoritos" href="#">

                        <i class="far fa-heart"></i>

                    </a>

                    <a id="btnCarrinho" href="#">

                        <i class="fas fa-shopping-cart"></i>

                    </a>

                    <a id="btnLogin" href="#">

                        <i class="far fa-user"></i>

                    </a>

                </div>

            </div>

        </header>

        <!--======================================================
MENU
=======================================================-->

        <nav id="menuPrincipal">

            <ul>

                <li><a id="menu1" href="#"></a></li>

                <li><a id="menu2" href="#"></a></li>

                <li><a id="menu3" href="#"></a></li>

                <li><a id="menu4" href="#"></a></li>

                <li><a id="menu5" href="#"></a></li>

                <li><a id="menu6" href="#"></a></li>

                <li><a id="menu7" href="#"></a></li>

            </ul>

        </nav>

        <!--======================================================
MAIN
=======================================================-->

        <main>

            <!--======================================================
BANNER
=======================================================-->

            <section id="banner">

                <div class="banner-texto">

                    <small id="bannerTag"></small>

                    <h2 id="bannerTitulo"></h2>

                    <p id="bannerDescricao"></p>

                    <button id="bannerBotao"></button>

                </div>

                <div class="banner-imagem">

                    <img id="bannerImagem" src="" alt="Banner">

                </div>

            </section>

            <!--======================================================
MAIS VENDIDOS
=======================================================-->

            <section id="maisVendidos">

                <h2 id="tituloMaisVendidos"></h2>

                <div class="produtos">

                    <!--======================================================
PRODUTO 1
=======================================================-->

                    <div class="cardProduto">

                        <span id="tagProduto1"></span>

                        <button id="favorito1">

                            <i class="far fa-heart"></i>

                        </button>

                        <img id="produtoImagem1" src="" alt="">

                        <span id="categoria1"></span>

                        <h3 id="produtoNome1"></h3>

                        <div id="estrelas1"></div>

                        <span id="precoAntigo1"></span>

                        <h2 id="preco1"></h2>

                        <button id="comprar1"></button>

                    </div>

                    <!--======================================================
PRODUTO 2
=======================================================-->

                    <div class="cardProduto">

                        <span id="tagProduto2"></span>

                        <button id="favorito2">

                            <i class="far fa-heart"></i>

                        </button>

                        <img id="produtoImagem2" src="" alt="">

                        <span id="categoria2"></span>

                        <h3 id="produtoNome2"></h3>

                        <div id="estrelas2"></div>

                        <span id="precoAntigo2"></span>

                        <h2 id="preco2"></h2>

                        <button id="comprar2"></button>

                    </div>

                    <!--======================================================
PRODUTO 3
=======================================================-->

                    <div class="cardProduto">

                        <span id="tagProduto3"></span>

                        <button id="favorito3">

                            <i class="far fa-heart"></i>

                        </button>

                        <img id="produtoImagem3" src="" alt="">

                        <span id="categoria3"></span>

                        <h3 id="produtoNome3"></h3>

                        <div id="estrelas3"></div>

                        <span id="precoAntigo3"></span>

                        <h2 id="preco3"></h2>

                        <button id="comprar3"></button>

                    </div>

                    <!--======================================================
PRODUTO 4
=======================================================-->

                    <div class="cardProduto">

                        <span id="tagProduto4"></span>

                        <button id="favorito4">

                            <i class="far fa-heart"></i>

                        </button>

                        <img id="produtoImagem4" src="" alt="">

                        <span id="categoria4"></span>

                        <h3 id="produtoNome4"></h3>

                        <div id="estrelas4"></div>

                        <span id="precoAntigo4"></span>

                        <h2 id="preco4"></h2>

                        <button id="comprar4"></button>

                    </div>

                </div>

            </section>

        </main>

        <!--======================================================
FOOTER
=======================================================-->

        <footer id="footer">

            <div class="footer-grid">

                <div>

                    <h3 id="footerTitulo1"></h3>

                    <p id="footerTexto1"></p>

                </div>

                <div>

                    <h3 id="footerTitulo2"></h3>

                    <a id="footerLink1" href="#"></a>

                    <a id="footerLink2" href="#"></a>

                    <a id="footerLink3" href="#"></a>

                </div>

                <div>

                    <h3 id="footerTitulo3"></h3>

                    <a id="footerContato1" href="#"></a>

                    <a id="footerContato2" href="#"></a>

                    <a id="footerContato3" href="#"></a>

                </div>

                <div>

                    <h3 id="footerTitulo4"></h3>

                    <a id="facebook" href="#"></a>

                    <a id="instagram" href="#"></a>

                    <a id="youtube" href="#"></a>

                </div>

            </div>

            <div class="copyright">

                <p id="copyright"></p>

            </div>

        </footer>

    </div>

</body>

</html>
