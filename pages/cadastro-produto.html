<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto</title>

    <link rel="stylesheet"
          href="../style/cadastro-produto.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <script src="../js/cadastro-produto.js"
            defer></script>

</head>

<body>

<!--======================================================
PAINEL ADMINISTRATIVO
=======================================================-->

<div id="adminApp">

<!--======================================================
SIDEBAR
=======================================================-->

<aside id="sidebar">

    <div class="logoAdmin">

        <img id="logoAdminImagem"
             src=""
             alt="">

        <div class="logoTexto">

            <h2 id="logoAdminTexto"></h2>

        </div>

    </div>

    <nav class="menuAdmin">

        <ul>

            <li>

                <a id="menuDashboard"
                   href="dashboard.html">

                    <i class="fas fa-chart-line"></i>

                    <span id="menuDashboardTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuProdutos"
                   href="produtos-lojista.html">

                    <i class="fas fa-box"></i>

                    <span id="menuProdutosTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuCadastrarProduto"
                   class="menuAtivo"
                   href="cadastro-produto.html">

                    <i class="fas fa-circle-plus"></i>

                    <span id="menuCadastrarProdutoTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuCategorias"
                   href="#">

                    <i class="fas fa-tags"></i>

                    <span id="menuCategoriasTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuPedidos"
                   href="#">

                    <i class="fas fa-cart-shopping"></i>

                    <span id="menuPedidosTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuClientes"
                   href="#">

                    <i class="fas fa-users"></i>

                    <span id="menuClientesTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuEstoque"
                   href="#">

                    <i class="fas fa-warehouse"></i>

                    <span id="menuEstoqueTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuRelatorios"
                   href="#">

                    <i class="fas fa-chart-pie"></i>

                    <span id="menuRelatoriosTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuConfiguracoes"
                   href="#">

                    <i class="fas fa-gear"></i>

                    <span id="menuConfiguracoesTexto"></span>

                </a>

            </li>

            <li>

                <a id="menuSair"
                   href="#">

                    <i class="fas fa-right-from-bracket"></i>

                    <span id="menuSairTexto"></span>

                </a>

            </li>

        </ul>

    </nav>

</aside>

<!--======================================================
CONTEÚDO
=======================================================-->

<div id="conteudoAdmin">

<!--======================================================
TOPBAR
=======================================================-->

<header id="topbar">

    <div class="topbarEsquerda">

        <button id="btnMenuMobile">

            <i class="fas fa-bars"></i>

        </button>

        <h1 id="tituloPagina"></h1>

    </div>

    <div class="topbarCentro">

        <input id="txtPesquisar"
               type="text"
               placeholder="">

        <button id="btnPesquisar">

            <i class="fas fa-search"></i>

        </button>

    </div>

    <div class="topbarDireita">

        <button id="btnNotificacoes">

            <i class="fas fa-bell"></i>

        </button>

        <div class="perfilAdmin">

            <img id="fotoPerfilAdmin"
                 src=""
                 alt="">

            <div class="perfilInfo">

                <strong id="nomeAdmin"></strong>

                <span id="cargoAdmin"></span>

            </div>

        </div>

    </div>

</header>

<!--======================================================
CONTEÚDO PRINCIPAL
=======================================================-->

<main id="cadastroProdutoMain">

    <section id="cabecalhoCadastro">

        <h2 id="tituloCadastro"></h2>

        <p id="subtituloCadastro"></p>

    </section>

    <section class="cardFormulario">

        <div class="cardTitulo">

            <i class="fas fa-file-circle-plus"></i>

            <h3 id="tituloInformacoesBasicas"></h3>

        </div>

        <div class="gridFormulario">

                        <!--=========================================
            LINHA 1
            ==========================================-->

            <div class="grupoFormulario">

                <label id="lblImagemProduto"
                       for="imagemProduto"></label>

                <input id="imagemProduto"
                       type="file"
                       accept="image/*">

            </div>

            <div class="grupoFormulario">

                <label id="lblNomeProduto"
                       for="nomeProduto"></label>

                <input id="nomeProduto"
                       type="text">

            </div>

            <div class="grupoFormulario">

                <label id="lblMarcaProduto"
                       for="marcaProduto"></label>

                <input id="marcaProduto"
                       type="text">

            </div>


            <!--=========================================
            LINHA 2
            ==========================================-->

            <div class="grupoFormulario">

                <label id="lblCategoriaProduto"
                       for="categoriaProduto"></label>

                <select id="categoriaProduto">

                </select>

            </div>

            <div class="grupoFormulario">

                <label id="lblSkuProduto"
                       for="skuProduto"></label>

                <input id="skuProduto"
                       type="text">

            </div>

            <div class="grupoFormulario">

                <label id="lblQuantidadeProduto"
                       for="quantidadeProduto"></label>

                <input id="quantidadeProduto"
                       type="number">

            </div>


            <!--=========================================
            LINHA 3
            ==========================================-->

            <div class="grupoFormulario">

                <label id="lblPrecoProduto"
                       for="precoProduto"></label>

                <div class="inputPreco">

                    <span>R$</span>

                    <input id="precoProduto"
                           type="number"
                           step="0.01">

                </div>

            </div>

            <div class="grupoFormulario">

                <label id="lblPrecoPromocional"
                       for="precoPromocional"></label>

                <div class="inputPreco">

                    <span>R$</span>

                    <input id="precoPromocional"
                           type="number"
                           step="0.01">

                </div>

            </div>

            <div class="grupoFormulario">

                <label id="lblStatusProduto"
                       for="statusProduto"></label>

                <select id="statusProduto">

                </select>

            </div>


            <!--=========================================
            LINHA 4
            ==========================================-->

            <div class="grupoFormulario grupoInteiro">

                <label id="lblTamanhosProduto"></label>

                <div id="listaTamanhos">

                    <button id="tamP"
                            type="button">P</button>

                    <button id="tamM"
                            type="button">M</button>

                    <button id="tamG"
                            type="button">G</button>

                    <button id="tamGG"
                            type="button">GG</button>

                    <button id="tamXG"
                            type="button">XG</button>

                    <button id="tamXXG"
                            type="button">XXG</button>

                </div>

            </div>

            <div class="grupoFormulario grupoInteiro">

                <label id="lblCoresProduto"
                       for="coresProduto"></label>

                <input id="coresProduto"
                       type="text">

            </div>

        </div>


    </section>

        <!--======================================================
        GALERIA DE IMAGENS
        =======================================================-->

        <section class="cardFormulario">

            <div class="cardTitulo">

                <i class="fas fa-images"></i>

                <h3 id="tituloGaleria"></h3>

            </div>

            <div id="galeriaProduto">

                <div class="imagemItem">

                    <img id="previewImagem1"
                         src=""
                         alt="">

                    <input id="imagem1"
                           type="file"
                           accept="image/*">

                </div>

                <div class="imagemItem">

                    <img id="previewImagem2"
                         src=""
                         alt="">

                    <input id="imagem2"
                           type="file"
                           accept="image/*">

                </div>

                <div class="imagemItem">

                    <img id="previewImagem3"
                         src=""
                         alt="">

                    <input id="imagem3"
                           type="file"
                           accept="image/*">

                </div>

                <div class="imagemItem">

                    <img id="previewImagem4"
                         src=""
                         alt="">

                    <input id="imagem4"
                           type="file"
                           accept="image/*">

                </div>

            </div>

        </section>

        <!--======================================================
        DESCRIÇÃO DO PRODUTO
        =======================================================-->

        <section class="cardFormulario">

            <div class="cardTitulo">

                <i class="fas fa-align-left"></i>

                <h3 id="tituloDescricao"></h3>

            </div>

            <div class="grupoFormulario">

                <label id="lblDescricaoCurta"
                       for="descricaoCurta"></label>

                <textarea id="descricaoCurta"
                          rows="4"></textarea>

            </div>

            <div class="grupoFormulario">

                <label id="lblDescricaoCompleta"
                       for="descricaoCompleta"></label>

                <textarea id="descricaoCompleta"
                          rows="8"></textarea>

            </div>

        </section>

                <!--======================================================
        AÇÕES
        =======================================================-->

        <section class="cardFormulario">

            <div id="acoesFormulario">

                <button id="btnCancelarProduto"
                        type="button">

                    <i class="fas fa-times"></i>

                    <span id="txtBtnCancelar"></span>

                </button>

                <button id="btnLimparProduto"
                        type="reset">

                    <i class="fas fa-broom"></i>

                    <span id="txtBtnLimpar"></span>

                </button>

                <button id="btnSalvarProduto"
                        type="button">

                    <i class="fas fa-floppy-disk"></i>

                    <span id="txtBtnSalvar"></span>

                </button>

            </div>

        </section>

</main>

<!--======================================================
FOOTER
=======================================================-->

<footer id="footerAdmin">

    <div class="footerEsquerda">

        <p id="footerTexto"></p>

    </div>

    <div class="footerDireita">

        <span id="footerVersao"></span>

    </div>

</footer>

</div>

</div>

</body>

</html>
