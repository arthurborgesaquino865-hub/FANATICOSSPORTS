<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produto</title>

    <link rel="stylesheet"
          href="../style/cadastro-produto.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <script src="../js/cadastro-produto.js"
            defer></script>

</head>

<body>

<div id="adminApp">

    <!--==================== SIDEBAR ====================-->

    <aside id="sidebar">

        <div class="logoAdmin">

            <img id="logoAdminImagem"
                 src=""
                 alt="Logo">

            <div class="logoTexto">

                <h2 id="logoAdminTexto"></h2>

            </div>

        </div>

        <nav class="menuAdmin">

            <ul>

                <li>

                    <a id="menuDashboard"
                       href="dashboard.html">

                        <i class="fas fa-chart-line"></i>

                        <span id="menuDashboardTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuProdutos"
                       href="produtos-lojista.html">

                        <i class="fas fa-box"></i>

                        <span id="menuProdutosTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuCadastrarProduto"
                       class="menuAtivo"
                       href="cadastro-produto.html">

                        <i class="fas fa-circle-plus"></i>

                        <span id="menuCadastrarProdutoTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuCategorias"
                       href="#">

                        <i class="fas fa-tags"></i>

                        <span id="menuCategoriasTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuPedidos"
                       href="#">

                        <i class="fas fa-cart-shopping"></i>

                        <span id="menuPedidosTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuClientes"
                       href="#">

                        <i class="fas fa-users"></i>

                        <span id="menuClientesTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuEstoque"
                       href="#">

                        <i class="fas fa-warehouse"></i>

                        <span id="menuEstoqueTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuRelatorios"
                       href="#">

                        <i class="fas fa-chart-pie"></i>

                        <span id="menuRelatoriosTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuConfiguracoes"
                       href="#">

                        <i class="fas fa-gear"></i>

                        <span id="menuConfiguracoesTexto"></span>

                    </a>

                </li>

                <li>

                    <a id="menuSair"
                       href="#">

                        <i class="fas fa-right-from-bracket"></i>

                        <span id="menuSairTexto"></span>

                    </a>

                </li>

            </ul>

        </nav>

    </aside>

    <!--==================== CONTEÚDO ====================-->

    <div id="conteudoAdmin">

        <!--==================== TOPBAR ====================-->

        <header id="topbar">

            <div class="topbarEsquerda">

                <button id="btnMenuMobile">

                    <i class="fas fa-bars"></i>

                </button>

                <h1 id="tituloPagina"></h1>

            </div>

            <div class="topbarCentro">

                <input id="txtPesquisar"
                       type="text"
                       placeholder="">

                <button id="btnPesquisar">

                    <i class="fas fa-search"></i>

                </button>

            </div>

            <div class="topbarDireita">

                <button id="btnNotificacoes">

                    <i class="fas fa-bell"></i>

                </button>

                <div class="perfilAdmin">

                    <img id="fotoPerfilAdmin"
                         src=""
                         alt="Administrador">

                    <div class="perfilInfo">

                        <strong id="nomeAdmin"></strong>

                        <span id="cargoAdmin"></span>

                    </div>

                </div>

            </div>

        </header>

        <!--==================== CONTEÚDO PRINCIPAL ====================-->

        <main id="cadastroProdutoMain">

             <section class="cards">



                <!-- PRODUTO -->


                <div class="card grande">

                    <h2>Cadastro Produto</h2>


                    <label>Nome do Produto</label>

                    <input id="produtoNome">



                    <label>Descrição</label>

                    <textarea id="produtoDescricao"></textarea>



                    <div class="linha">


                        <div>

                            <label>Código</label>
                            <input id="produtoCodigo">

                        </div>



                        <div>

                            <label>Preço Antigo</label>

                            <input id="produtoPrecoAntigo" type="number">


                        </div>



                        <div>

                            <label>Preço Promoção</label>

                            <input id="produtoPrecoPromo" type="number">


                        </div>


                    </div>




                    <div class="linha">


                        <div>

                            <label>Estoque</label>

                            <input id="produtoEstoque" type="number">

                        </div>



                        <div>

                            <label>Marca</label>


                            <select id="produtoMarca">

                            </select>


                        </div>




                        <div>

                            <label>Categoria</label>


                            <select id="produtoCategoria">

                            </select>


                        </div>



                    </div>



                    <label>Status</label>


                    <select id="produtoStatus">

                        <option value="true">
                            Ativo
                        </option>


                        <option value="false">
                            Inativo
                        </option>


                    </select>



                    <button id="btnProduto">
                        Cadastrar Produto
                    </button>



                </div>







                <!-- MARCA -->


                <div class="card">


                    <h2>Marca</h2>


                    <label>Nome</label>


                    <input id="marcaNome">



                    <label>Logo</label>


                    <input id="marcaLogo" type="file">



                    <button id="btnMarca">
                        Salvar Marca
                    </button>


                </div>







                <!-- CATEGORIA -->


                <div class="card">


                    <h2>Categoria</h2>


                    <label>Nome Categoria</label>


                    <input id="categoriaNome">



                    <button id="btnCategoria">

                        Salvar Categoria

                    </button>


                </div>








                <!-- COR -->


                <div class="card">


                    <h2>Cores</h2>


                    <label>Nome</label>


                    <input id="corNome">



                    <label>Código Cor</label>


                    <input id="corCodigo" placeholder="#FFFFFF">



                    <button id="btnCor">

                        Salvar Cor

                    </button>


                </div>








                <!-- TAMANHO -->


                <div class="card">


                    <h2>Tamanho</h2>


                    <label>Tamanho</label>


                    <input id="tamanhoNome" placeholder="P,M,G,GG">


                    <button id="btnTamanho">

                        Salvar Tamanho

                    </button>


                </div>







                <!-- IMAGEM -->

                <div class="card">


                    <h2>Imagem Produto</h2>



                    <label>Produto</label>


                    <select id="imagemProduto">

                    </select>




                    <label>Arquivo</label>


                    <input id="imagemArquivo" type="file">



                    <button id="btnImagem">

                        Salvar Imagem

                    </button>



                </div>





            </section>


        
           

        </main>

                <!--======================================================
        FOOTER
        =======================================================-->

        <footer id="footerAdmin">

            <div class="footerEsquerda">

                <p id="footerTexto"></p>

            </div>

            <div class="footerDireita">

                <span id="footerVersao"></span>

            </div>

        </footer>

    </div>

</div>

</body>

</html>
