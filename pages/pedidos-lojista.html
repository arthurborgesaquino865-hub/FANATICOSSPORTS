<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Fanáticos Sports</title>

    <link rel="stylesheet"
          href="../style/pedidos-lojista.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <script src="../js/pedidos-lojista.js"
            defer></script>

</head>

<body>

<!--======================================================
CONTAINER PRINCIPAL
=======================================================-->

<div id="containerSistema">

<!--======================================================
MENU LATERAL
=======================================================-->

<aside id="sidebar">

    <div id="logoSidebar">

        <img id="logoImagem"
             src=""
             alt="">

        <h2 id="logoTexto"></h2>

    </div>

    <nav id="menuLateral">

        <!-- Carregado pelo JS -->

    </nav>

</aside>

<!--======================================================
CONTEÚDO PRINCIPAL
=======================================================-->

<main id="conteudoPrincipal">

<!--======================================================
TOPBAR
=======================================================-->

<header id="topbar">

    <div id="tituloPagina">

        <h1 id="tituloPrincipal"></h1>

    </div>

    <div id="pesquisaTopo">

        <input id="campoPesquisaTopo"
               type="text">

        <button id="btnPesquisar">

            <i class="fas fa-search"></i>

        </button>

    </div>

    <div id="usuarioTopo">

        <button id="btnNotificacao">

            <i class="fas fa-bell"></i>

        </button>

        <img id="fotoUsuario"
             src=""
             alt="">

        <div id="dadosUsuario">

            <h3 id="nomeUsuario"></h3>

            <span id="cargoUsuario"></span>

        </div>

    </div>

</header>

<!--======================================================
CABEÇALHO DA PÁGINA
=======================================================-->

<section id="cabecalhoPedidos">

    <div id="textoCabecalho">

        <h2 id="tituloPedidos"></h2>

        <p id="descricaoPedidos"></p>

    </div>

    <button id="btnAtualizarPedidos">

        <i class="fas fa-rotate-right"></i>

        <span id="textoAtualizarPedidos"></span>

    </button>

</section>

<!--======================================================
CARDS RESUMO
=======================================================-->

<section id="cardsResumo">

    <!-- Carregado pelo JS -->

</section>

<!--======================================================
FILTROS
=======================================================-->

<section id="areaFiltros">

    <div class="filtro">

        <label id="lblPesquisarPedido"
               for="pesquisaPedido"></label>

        <input id="pesquisaPedido"
               type="text">

    </div>

    <div class="filtro">

        <label id="lblCliente"
               for="filtroCliente"></label>

        <select id="filtroCliente">

        </select>

    </div>

    <div class="filtro">

        <label id="lblStatus"
               for="filtroStatus"></label>

        <select id="filtroStatus">

        </select>

    </div>

    <div class="filtro">

        <label id="lblPagamento"
               for="filtroPagamento"></label>

        <select id="filtroPagamento">

        </select>

    </div>

    <div class="filtro">

        <label id="lblData"
               for="filtroData"></label>

        <input id="filtroData"
               type="date">

    </div>

</section>

<!--======================================================
TABELA PEDIDOS
=======================================================-->

<section id="tabelaPedidos">

    <table id="pedidosTabela">

        <thead>

            <tr>

                <th id="thPedido"></th>

                <th id="thCliente"></th>

                <th id="thData"></th>

                <th id="thPagamento"></th>

                <th id="thTotal"></th>

                <th id="thStatus"></th>

                <th id="thAcoes"></th>

            </tr>

        </thead>

        <tbody id="listaPedidos">

            <!-- Pedidos carregados pelo JavaScript -->

        </tbody>

    </table>

</section>

<!--======================================================
PAGINAÇÃO
=======================================================-->

<section id="paginacaoPedidos">

    <button id="btnPaginaAnterior">

        <i class="fas fa-chevron-left"></i>

    </button>

    <div id="numeracaoPaginas">

        <!-- JS -->

    </div>

    <button id="btnPaginaProxima">

        <i class="fas fa-chevron-right"></i>

    </button>

</section>

<!--======================================================
MODAL VISUALIZAR PEDIDO
=======================================================-->

<div id="modalVisualizarPedido"
     class="modal">

    <div class="modalConteudo">

        <button id="btnFecharVisualizar">

            <i class="fas fa-times"></i>

        </button>

        <div id="detalhesPedido">

            <div id="cabecalhoDetalhes">

                <h2 id="tituloDetalhesPedido"></h2>

                <span id="statusDetalhesPedido"></span>

            </div>

            <div id="informacoesPedido">

                <div class="grupoInformacoes">

                    <h3 id="tituloCliente"></h3>

                    <p id="nomeCliente"></p>

                    <p id="cpfCliente"></p>

                    <p id="telefoneCliente"></p>

                </div>

                <div class="grupoInformacoes">

                    <h3 id="tituloEntrega"></h3>

                    <p id="enderecoEntrega"></p>

                    <p id="cidadeEntrega"></p>

                    <p id="cepEntrega"></p>

                </div>

                <div class="grupoInformacoes">

                    <h3 id="tituloPagamento"></h3>

                    <p id="formaPagamento"></p>

                    <p id="valorPedido"></p>

                    <p id="fretePedido"></p>

                    <p id="descontoPedido"></p>

                    <p id="totalPedido"></p>

                </div>

            </div>

            <div id="produtosPedido">

                <h3 id="tituloProdutosPedido"></h3>

                <table id="tabelaProdutosPedido">

                    <thead>

                        <tr>

                            <th id="thProdutoPedido"></th>

                            <th id="thQuantidadePedido"></th>

                            <th id="thValorUnitarioPedido"></th>

                            <th id="thSubtotalPedido"></th>

                        </tr>

                    </thead>

                    <tbody id="listaProdutosPedido">

                        <!-- JS -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!--======================================================
MODAL ALTERAR STATUS
=======================================================-->

<div id="modalStatusPedido"
     class="modal">

    <div class="modalConteudo modalPequeno">

        <h3 id="tituloAlterarStatus"></h3>

        <p id="descricaoAlterarStatus"></p>

        <select id="novoStatusPedido">

        </select>

        <div id="acoesStatus">

            <button id="btnCancelarStatus">

                <span id="textoCancelarStatus"></span>

            </button>

            <button id="btnSalvarStatus">

                <i class="fas fa-check"></i>

                <span id="textoSalvarStatus"></span>

            </button>

        </div>

    </div>

</div>

<!--======================================================
RODAPÉ
=======================================================-->

<footer id="rodapeSistema">

    <p id="textoRodape"></p>

</footer>

</main>

</div>

</body>

</html>
