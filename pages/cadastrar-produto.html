<!DOCTYPE html>

<html lang="pt-BR">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Cadastrar Produto</title>



<link rel="stylesheet" href="../style/cadastrar-produto.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">



<script src="../js/cadastrar-produto.js" defer></script>


</head>



<body>


<div id="adminApp">





<!--======================================================
SIDEBAR
=======================================================-->



<aside id="sidebar">



<div class="logoAdmin">


<img id="logoAdminImagem"
src=""
alt="">


<h2 id="logoAdminTexto"></h2>


</div>





<nav class="menuAdmin">


<ul>



<li>

<a id="menuDashboard" href="#">

<i class="fas fa-chart-line"></i>

<span id="menuDashboardTexto"></span>

</a>

</li>





<li>

<a id="menuProdutos" href="#">

<i class="fas fa-box"></i>

<span id="menuProdutosTexto"></span>

</a>

</li>





<li>

<a id="menuCadastrarProduto" href="#">

<i class="fas fa-plus-circle"></i>

<span id="menuCadastrarProdutoTexto"></span>

</a>

</li>





<li>

<a id="menuCategorias" href="#">

<i class="fas fa-tags"></i>

<span id="menuCategoriasTexto"></span>

</a>

</li>





<li>

<a id="menuPedidos" href="#">

<i class="fas fa-shopping-cart"></i>

<span id="menuPedidosTexto"></span>

</a>

</li>





<li>

<a id="menuClientes" href="#">

<i class="fas fa-users"></i>

<span id="menuClientesTexto"></span>

</a>

</li>





<li>

<a id="menuEstoque" href="#">

<i class="fas fa-warehouse"></i>

<span id="menuEstoqueTexto"></span>

</a>

</li>





<li>

<a id="menuRelatorios" href="#">

<i class="fas fa-chart-pie"></i>

<span id="menuRelatoriosTexto"></span>

</a>

</li>





<li>

<a id="menuConfiguracoes" href="#">

<i class="fas fa-cog"></i>

<span id="menuConfiguracoesTexto"></span>

</a>

</li>





<li>

<a id="menuSair" href="#">

<i class="fas fa-sign-out-alt"></i>

<span id="menuSairTexto"></span>

</a>

</li>



</ul>


</nav>



</aside>






<!--======================================================
CONTEÚDO
=======================================================-->



<div id="conteudoAdmin">


  <!--======================================================
TOPBAR
=======================================================-->


<header id="topbar">



<div class="topbarLeft">


<button id="btnMenuMobile">


<i class="fas fa-bars"></i>


</button>




<h1 id="tituloPagina"></h1>



</div>







<div class="topbarCenter">



<input id="txtPesquisarAdmin"
type="text"
placeholder="">



<button id="btnPesquisarAdmin">


<i class="fas fa-search"></i>


</button>



</div>








<div class="topbarRight">



<button id="btnNotificacoes">


<i class="fas fa-bell"></i>


</button>





<div class="perfilAdmin">



<img id="fotoPerfilAdmin"
src=""
alt="">





<div class="perfilInfo">



<strong id="nomeAdmin"></strong>



<span id="cargoAdmin"></span>



</div>



</div>



</div>



</header>






<!--======================================================
MAIN
=======================================================-->



<main id="cadastroProdutoMain">





<!--======================================================
TÍTULO
=======================================================-->



<section id="cabecalhoCadastro">



<h2 id="tituloCadastroProduto"></h2>



<p id="descricaoCadastroProduto"></p>



</section>









<!--======================================================
FORMULÁRIO
=======================================================-->



<section class="boxDashboard">





<form id="formCadastroProduto">





<!-- IMAGEM -->



<div class="formGrupo">



<label id="labelImagemProduto"></label>



<input 
id="imagemProduto"
type="file"
accept="image/*">



</div>








<!-- NOME -->



<div class="formGrupo">



<label id="labelNomeProduto"></label>



<input 
id="nomeProduto"
type="text">



</div>








<!-- CATEGORIA -->



<div class="formGrupo">



<label id="labelCategoriaProduto"></label>



<select id="categoriaProduto">



</select>



</div>








<!-- MARCA -->



<div class="formGrupo">



<label id="labelMarcaProduto"></label>



<input
id="marcaProduto"
type="text">



</div>








<!-- PREÇO -->



<div class="formGrupo">



<label id="labelPrecoProduto"></label>



<input
id="precoProduto"
type="number"
step="0.01">



</div>








<!-- ESTOQUE -->



<div class="formGrupo">



<label id="labelEstoqueProduto"></label>



<input
id="estoqueProduto"
type="number">



</div>








<!-- TAMANHOS -->



<div class="formGrupo">



<label id="labelTamanhoProduto"></label>



<div id="listaTamanhos">



</div>



</div>








<!-- DESCRIÇÃO -->



<div class="formGrupo">



<label id="labelDescricaoProduto"></label>



<textarea id="descricaoProduto"></textarea>



</div>




<!--======================================================
PREVIEW IMAGEM
=======================================================-->


<div class="previewProduto">


<img id="previewImagemProduto"
src=""
alt="">


</div>









<!--======================================================
BOTÕES
=======================================================-->



<div class="acoesCadastro">



<button 
id="btnCancelarProduto"
type="button">


</button>





<button 
id="btnSalvarProduto"
type="submit">


</button>



</div>






</form>


</section>






</main>







<!--======================================================
FOOTER
=======================================================-->



<footer id="footerAdmin">



<div class="footerContainer">



<div class="footerEsquerda">



<p id="footerTexto"></p>



</div>







<div class="footerDireita">



<span id="footerVersao"></span>



</div>





</div>



</footer>







</div>
<!-- FIM #conteudoAdmin -->





</div>
<!-- FIM #adminApp -->






</body>


</html>
